name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.6.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app"
          else
            echo "ERRO: Xcode não encontrado"
            exit 1
          fi

          xcode-select -p
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI workload
        run: |
          dotnet workload install maui

      - name: Show project
        run: |
          cat MauiApp1/MauiApp1.csproj

      - name: Restore iOS ARM64
        run: |
          dotnet restore MauiApp1/MauiApp1.csproj \
            -p:TargetFramework=net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64

      - name: Publish iOS
        run: |
          dotnet publish MauiApp1/MauiApp1.csproj \
            -f net9.0-ios \
            -c Release \
            -r ios-arm64 \
            --no-restore \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:ArchiveOnBuild=false

      - name: Find APP
        run: |
          echo "Procurando .app..."
          find . -type d -name "*.app" -print

      - name: Create unsigned IPA
        run: |
          APP=$(find . -type d -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: nenhum .app foi encontrado"
            find bin obj -maxdepth 8 -type f 2>/dev/null | head -n 200
            exit 1
          fi

          echo "APP encontrado: $APP"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/MauiApp1.app

          cd ipa
          zip -r ../MauiApp1.ipa Payload
          cd ..

          ls -lh MauiApp1.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MauiApp1-IPA
          path: MauiApp1.ipa
          if-no-files-found: error
